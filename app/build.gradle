plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id "kotlin-android"
    id "kotlin-parcelize"
    id "kotlin-kapt"
}

android {
    namespace 'com.marshal'
    compileSdk 33
    buildToolsVersion '33.0.0'

    defaultConfig {
        applicationId "com.marshal"
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName "0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //分包
        multiDexEnabled true
        kapt {
            arguments {
                arg("AROUTER_MODULE_NAME", project.getName())
            }
        }

    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    signingConfigs {
        debug {
            keyAlias 'marshalIM'
            keyPassword 'Wasd@150136'
            storeFile file(".\\..\\doc\\key\\marshalIM.jks")
            storePassword 'Wasd@150136'
        }
        release {
            keyAlias 'marshalIM'
            keyPassword 'Wasd@150136'
            storeFile file(".\\..\\doc\\key\\marshalIM.jks")
            storePassword 'Wasd@150136'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            zipAlignEnabled true
            debuggable = true
        }
        release {
            signingConfig signingConfigs.release
            debuggable = false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
    }

    configurations {
        cleanedAnnotations
        // implementation.exclude group: 'org.jetbrains' , module:'annotations'
        implementation.exclude group: 'com.intellij' , module:'annotations'
    }

}

dependencies {
    api fileTree(includes: ['*.jar'],dir: 'libs')

    //依赖的模块
    implementation project(path: ":base-common")
    implementation project(':zz-excel-creator')
    implementation project(':driving-school')
    kapt deps.support.arouter_compiler


}