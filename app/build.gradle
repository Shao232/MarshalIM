plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id "kotlin-android"
    id "kotlin-parcelize"
    id "kotlin-kapt"

}

android {
    namespace 'com.marshal'
    compileSdk 34
    buildToolsVersion '33.0.0'

    defaultConfig {
        applicationId "com.marshal"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //分包
        multiDexEnabled true
        kapt {
            arguments {
                arg("AROUTER_MODULE_NAME", project.getName())
            }
        }

        ndk {
            //armeabi-v7a 兼容armeabi
            //目前适配的是绝大部分新老用户的手机和平板
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64", "x86"
        }

        manifestPlaceholders = [
                JPUSH_PKGNAME : applicationId,
                JPUSH_APPKEY : "3f6401486374f034584ca603", //JPush 上注册的包名对应的 Appkey.
                JPUSH_CHANNEL : "developer-default", //暂时填写默认值即可.
        ]

        sourceSets {
            main {//表示为main
                jni.srcDirs = ["libs"]
            }
        }

    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    signingConfigs {
        debug {
            keyAlias 'marshalIM'
            keyPassword 'Wasd@150136'
            storeFile file("../../MarshalIM/doc/key/marshalIM.jks")
            storePassword 'Wasd@150136'
        }
        release {
            keyAlias 'marshalIM'
            keyPassword 'Wasd@150136'
//            storeFile file("E:\\work\\MarshalProject\\MarshalIM\\doc\\key\\marshalIM.jks")
            storeFile file("../../MarshalIM/doc/key/marshalIM.jks")
            storePassword 'Wasd@150136'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
            zipAlignEnabled true
            debuggable = true
        }
        release {
            signingConfig signingConfigs.release
            debuggable = false
            //开启混淆
            minifyEnabled false
            //压缩优化
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
    }

    configurations {
        cleanedAnnotations
        implementation.exclude group: 'com.intellij', module: 'annotations'
    }

}


dependencies {
    api fileTree(includes: ['*.jar'], dir: 'libs')
    implementation(fileTree("libs"))
    implementation files('libs/AIKit.aar')
    //依赖的模块
    implementation project(":base-common")
    implementation project(':driving-school')
    implementation project(":moudle-calendar-schedule")
    implementation project(":moudle-open-question")
    implementation project(':module-wan-android')

    kapt deps.support.arouter_compiler

}