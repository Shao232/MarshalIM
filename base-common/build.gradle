plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id "kotlin-parcelize"
    id "kotlin-kapt"
}

android {
    namespace 'com.marshal.base_common'
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        multiDexEnabled true
        kapt {
            arguments {
                arg("AROUTER_MODULE_NAME",  project.getName())
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
    }

}

dependencies {
    api files('libs/jxl.jar')

    api deps.android.appcompat
    api deps.android.material
    api deps.android.constraintlayout
    api deps.android.activity_ktx
    api deps.android.fragment_ktx
    //kotlin
    api deps.android.kotlin_core_ktx
    api deps.android.kotlinx_coroutines_core
    api deps.android.kotlinx_coroutines_android
    api deps.android.lifecycle_livedata_ktx
    api deps.android.lifecycle_viewmodel_ktx
    api deps.android.lifecycle_runtime_ktx
    api deps.android.lifecycle_extensions
    api deps.android.multidex
    api deps.android.work_runtime
    api deps.android.room_runtime
    api deps.android.room_compiler
    api deps.android.room_ktx
    api deps.android.room_rxjava2
    api deps.android.room_guava

    //第三方
    api deps.support.gson
    api deps.support.glide
    annotationProcessor deps.support.glide_compiler
    api deps.support.eventbus
    api deps.support.okhttp3
    api deps.support.logging_interceptor
    api deps.support.retrofit
    api deps.support.converter_scalars
    api deps.support.converter_gson
    api deps.support.adapter_rxjava2
    api deps.support.rxjava
    api deps.support.rxandroid
    api deps.support.refresh_layout_kernel
    api deps.support.refresh_header_classics
    api deps.support.refresh_footer_classics
    api deps.support.arouter_api
    kapt deps.support.arouter_compiler
    api deps.support.mmkv
    api deps.support.immersionbar
    api deps.support.immersionbar_ktx

    debugImplementation deps.support.leakcanary_android
    releaseImplementation deps.support.leakcanary_android_no_op

}